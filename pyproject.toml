[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb-ascii-renderer"
version = "0.1.0"
description = "Real-time RGB ASCII video renderer using Python, FFmpeg, and ANSI True Color"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["src"]
