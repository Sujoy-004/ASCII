# Reproducible quality gate for rgb-ascii-renderer.
#
# The test suite is hermetic: FFmpeg/FFplay/FFprobe are faked, so no external
# binaries are installed here. One decoder-corruption test drives a real FFmpeg
# and skips itself when it is absent. The renderer itself is standard-library
# only, so `pip install -e ".[dev]"` pulls in the toolchain and nothing else.
#
# Matrix rationale: pyproject declares requires-python >= 3.10 with no upper
# bound, so this pins the declared floor (3.10) and a current interpreter
# (3.13) rather than inventing a wide matrix. The README documents Windows,
# macOS and Linux support, so both a POSIX and a Windows runner are covered --
# terminal sizing and subprocess handling are the platform-sensitive parts.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs the project itself (so `from src...` resolves from any working
      # directory) plus pytest, mypy and ruff.
      - name: Install project and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Byte-compile sources
        run: python -m compileall -q src

      - name: Import every module
        run: python -c "import importlib,pkgutil,src; [importlib.import_module('src.'+m.name) for m in pkgutil.iter_modules(src.__path__)]; print('all modules import cleanly')"

      - name: Tests
        run: python -m pytest -q

      - name: Types (mypy)
        run: python -m mypy

      # Scope and rule selection are documented in [tool.ruff] in
      # pyproject.toml. The gate is deliberately narrow (pyflakes +
      # a pycodestyle subset); widen it in its own change.
      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Benchmark smoke (deterministic, tiny grid, no FFmpeg)
        run: python bench.py --repeat 1 --sizes 8x4 --src 8x4
